<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6A53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مصحف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: sticky top bar + one scrolling reading column + fixed bottom tab bar; Quran text is the hero, everything else is quiet utility. */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --surface2:#E2EAE6; --fg:#13302A; --muted:#566F67; --line:#C8D6D0;
  --accent:#0D6A53; --accent-fg:#FFFFFF; --accent-soft:#D5EBE3; --gold:#9C7116; --hl:#FFF0BF; --play:#CDEBDD;
  --danger:#A3322B; --shadow:0 -6px 24px rgba(10,40,32,.10);
  --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-quran:'Amiri Quran','Amiri','Traditional Arabic',serif;
  --f-text:'Amiri','Traditional Arabic','Times New Roman',serif;
  --f-disp:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --qfs:30px; --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1815; --surface:#12231F; --surface2:#1A2E28; --fg:#E5EEE9; --muted:#92ADA3; --line:#26403A;
  --accent:#52C7A4; --accent-fg:#05231B; --accent-soft:#17382F; --gold:#D8B45A; --hl:#3A3820; --play:#1F4638;
  --danger:#F08A82; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1815; --surface:#12231F; --surface2:#1A2E28; --fg:#E5EEE9; --muted:#92ADA3; --line:#26403A;
  --accent:#52C7A4; --accent-fg:#05231B; --accent-soft:#17382F; --gold:#D8B45A; --hl:#3A3820; --play:#1F4638;
  --danger:#F08A82; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:720px;margin:0 auto;min-height:100vh}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-family:var(--f-disp);font-size:22px;color:var(--accent);white-space:nowrap}
.brand span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg);background:var(--surface2);flex:none}
.ibtn svg{width:20px;height:20px}
.ibtn:active{transform:scale(.95)}
.toolbar{display:flex;gap:8px;margin-top:10px;align-items:stretch;min-width:0}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;height:42px;text-align:right}
.pick b{font-family:var(--f-disp);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pick svg{width:18px;height:18px;flex:none;color:var(--muted)}
select.pick{appearance:none;-webkit-appearance:none;font-size:15px;padding-inline:12px;text-overflow:ellipsis;cursor:pointer}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}

main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body.has-player main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}

/* quran reader */
.surah-head{text-align:center;padding:18px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.surah-head h1{font-family:var(--f-disp);font-weight:600;font-size:34px;line-height:1.3;margin:0;color:var(--accent)}
.surah-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.basmala{font-family:var(--f-quran);font-size:calc(var(--qfs) + 2px);text-align:center;padding:14px 0 4px;color:var(--gold)}
.mushaf{font-family:var(--f-quran);font-size:var(--qfs);line-height:2.25;text-align:justify;word-spacing:1px;padding:6px 2px}
.ay{border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:2px 0;transition:background .15s}
.ay.sel{background:var(--hl)}
.ay.playing{background:var(--play)}
.mk{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;margin:0 .22em;border:1.5px solid var(--gold);border-radius:50%;
  font-family:var(--f-ui);font-size:.42em;color:var(--gold);vertical-align:middle;line-height:1;padding-top:.1em;font-weight:500}
.surah-nav{display:flex;gap:10px;margin-top:18px}
.surah-nav button{flex:1;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--accent);font-weight:500}

/* sheets */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,20,16,.55);animation:fade .2s}
.panel{position:relative;width:100%;max-width:720px;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0}
.panel-body{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));min-height:0;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;min-width:0}
.srow:last-child{border-bottom:0}
.snum{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);font-size:14px;font-weight:500;transform:rotate(45deg)}
.snum span{transform:rotate(-45deg)}
.srow .nm{font-family:var(--f-disp);font-size:19px;flex:1;min-width:0}
.srow .meta{color:var(--muted);font-size:13px;flex:none}
.srow.cur{background:var(--accent-soft);border-radius:10px}
.hit{display:block;width:100%;text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
.hit .ref{font-size:12px;color:var(--gold);font-weight:600}
.hit .tx{font-family:var(--f-quran);font-size:19px;line-height:1.9}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}

.ayah-box{font-family:var(--f-quran);font-size:26px;line-height:2.1;text-align:center;padding:10px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.act{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:500;min-width:0}
.act svg{width:17px;height:17px}
.act.on{background:var(--accent-soft);color:var(--accent)}
.act.primary{background:var(--accent);color:var(--accent-fg)}
.tafsir{font-family:var(--f-text);font-size:20px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}
.tafsir .vn{font-family:var(--f-ui);font-size:.62em;color:var(--gold);font-weight:600;margin:0 2px}
.tafsir .qt{color:var(--accent)}
.range{font-size:13px;color:var(--muted);margin-bottom:8px}
.stepper{display:flex;gap:8px;margin-top:16px}
.stepper button{flex:1;padding:10px;border-radius:10px;background:var(--surface2);font-weight:500;font-size:14px}
.stepper button[disabled]{opacity:.4}

/* player */
#player{position:fixed;z-index:70;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#player[hidden]{display:none}
.pin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-width:0}
.pinfo{flex:1;min-width:0;line-height:1.35}
.pinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.pbtn.main{background:var(--accent);color:var(--accent-fg);width:44px;height:44px}
.pbtn svg{width:19px;height:19px;fill:currentColor;stroke:none}
.ext{font-size:13px;color:var(--accent);font-weight:600;text-decoration:underline;white-space:nowrap}
.pwarn{max-width:720px;margin:6px auto 0;font-size:12.5px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;z-index:80;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:flex;height:var(--nav-h)}
.tabs-in button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:500}
.tabs-in button svg{width:23px;height:23px}
.tabs-in button[aria-selected="true"]{color:var(--accent)}
.tabs-in button[aria-selected="true"] svg{stroke-width:2.2}

/* cards (hadith / adhkar) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px}
.card .no{display:inline-block;font-size:12.5px;font-weight:600;color:var(--gold);margin-bottom:6px}
.card .tx{font-family:var(--f-text);font-size:20px;line-height:2;overflow-wrap:anywhere;white-space:pre-wrap}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin:8px 2px 14px}
.loadbox{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center}
.loadbox p{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.more{display:block;margin:6px auto 0;padding:10px 22px;border-radius:12px;background:var(--surface2);font-weight:500}
.cat{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;min-width:0}
.cat .nm{flex:1;min-width:0;font-weight:500}
.cat .ct{color:var(--muted);font-size:13px;flex:none}
.cat svg{width:16px;height:16px;color:var(--muted);flex:none;transform:scaleX(-1)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;margin-bottom:10px;padding:6px 2px}
.back svg{width:18px;height:18px}
.dh{font-family:var(--f-disp);font-size:24px;color:var(--accent);margin:4px 0 12px;line-height:1.5}
.counter{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px}
.counter.done{background:var(--accent-soft);color:var(--accent)}
.card.done{opacity:.7}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.hello{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hello h2{margin:0 0 4px;font-family:var(--f-disp);font-size:22px;color:var(--accent)}
.hello p{margin:0 0 12px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface2);font-size:14px;text-align:right;min-width:0}
.msg{max-width:92%;padding:11px 14px;border-radius:16px;line-height:1.85;font-size:16.5px;overflow-wrap:anywhere}
.msg.u{align-self:flex-start;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-inline-start:20px}
.msg.err{color:var(--danger)}
.composer{position:fixed;z-index:75;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.composer[hidden]{display:none}
.comp-in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.comp-in textarea{flex:1;min-width:0;resize:none;max-height:130px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;line-height:1.6}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;transform:scaleX(-1)}
.send[disabled]{opacity:.5}
body.is-ask #player{bottom:calc(var(--nav-h) + 72px + env(safe-area-inset-bottom,0px))}
body.is-ask main{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}

#toast{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));background:#10241f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast[hidden]{display:none}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;margin:18px auto}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

async function initQuran(){

function openSurah(n,focus){

  if($('#pSurahName'))$('#pSurahName').textContent=s.n;

  const body=ay.map((t,i)=>`<span class="ay" data-a="${i+1}" id="a${i+1}">${esc(t)}<span class="mk">${AR(i+1)}</span></span>`).join(' ');

/* surah sheet */
function openSurahSheet(){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="seg" style="margin-bottom:10px"><button id="sgS" aria-pressed="true">السور</button><button id="sgB" aria-pressed="false">علاماتي</button></div>
  <input class="search" id="sq" type="search" placeholder="ابحث باسم السورة أو رقمها أو بكلمات من آية" aria-label="بحث">
  <div id="slist"></div>`;
  openSheet('الفهرس',wrap);
  let mode='s';
  const list=$('#slist',wrap),q=$('#sq',wrap);
  const row=(i)=>{const s=Q.s[i];return `<button class="srow ${i+1===S.surah?'cur':''}" data-s="${i+1}"><span class="snum"><span>${AR(i+1)}</span></span><span class="nm">${esc(s.n)}</span><span class="meta">${s.t==='م'?'مدنية':'مكية'} · ${AR(s.c)}</span></button>`};
  function draw(){
    const t=q.value.trim();
    if(mode==='b'){
      q.hidden=true;
      list.innerHTML=S.bm.length?S.bm.map((b,i)=>`<button class="hit" data-s="${b.s}" data-a="${b.a}"><div class="ref">سورة ${esc(Q.s[b.s-1].n)} · الآية ${AR(b.a)}</div><div class="tx">${esc(Q.a[b.s-1][b.a-1])}</div></button>`).join(''):'<div class="empty">لا توجد علامات بعد. افتح أي آية واضغط «علامة».</div>';return;
    }
    q.hidden=false;
    if(!t){list.innerHTML=Q.s.map((_,i)=>row(i)).join('');return}
    const nt=NORM(t);
    const byName=[];Q.s.forEach((s,i)=>{if(String(i+1)===t||NORM(s.n).includes(nt))byName.push(i)});
    let html=byName.map(row).join('');
    if(nt.length>=3&&!/^\d+$/.test(nt)){
      const hits=[];
      outer:for(let i=0;i<114;i++){const arr=Q.n[i];for(let j=0;j<arr.length;j++){if(arr[j].includes(nt)){hits.push([i,j]);if(hits.length>=40)break outer}}}
      html+=hits.map(([i,j])=>`<button class="hit" data-s="${i+1}" data-a="${j+1}"><div class="ref">سورة ${esc(Q.s[i].n)} · الآية ${AR(j+1)}</div><div class="tx">${esc(Q.a[i][j])}</div></button>`).join('');
    }
    list.innerHTML=html||'<div class="empty">لا توجد نتائج</div>';
  }
  q.oninput=draw;
  $('#sgS',wrap).onclick=()=>{mode='s';$('#sgS',wrap).setAttribute('aria-pressed','true');$('#sgB',wrap).setAttribute('aria-pressed','false');draw()};
  $('#sgB',wrap).onclick=()=>{mode='b';$('#sgB',wrap).setAttribute('aria-pressed','true');$('#sgS',wrap).setAttribute('aria-pressed','false');draw()};
  list.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;closeSheet();openSurah(+b.dataset.s,b.dataset.a?+b.dataset.a:0)};
  draw();
}

/* ayah sheet with tafsir */
const TAFS={muyassar:['التفسير الميسر','tafsir-muyassar','مجمع الملك فهد'],saadi:['تفسير السعدي','tafsir-saadi','الشيخ عبد الرحمن السعدي']};
function fmtTafsir(t){
  return esc(t).replace(/\{(\d+)\}/g,(m,n)=>'<span class="vn">('+AR(n)+')</span>').replace(/\{([^{}]+)\}/g,'<span class="qt">﴿$1﴾</span>');
}
async function openAyah(s,a){
  selectAyah(a);S.pl&&markPlaying();
  lsSet('last',{s,a});
  const total=Q.s[s-1].c;
  const wrap=document.createElement('div');
  const isBm=()=>S.bm.some(b=>b.s===s&&b.a===a);
  wrap.innerHTML=`<div class="ayah-box">${esc(Q.a[s-1][a-1])}</div>
  <div class="acts">
    <button class="act primary" id="aPlay">${I.play}استماع</button>
    <button class="act" id="aCopy">${I.copy}نسخ</button>
    <button class="act ${isBm()?'on':''}" id="aBm">${I.mark}علامة</button>
    <button class="act" id="aAsk">${I.ask}اسأل</button>
  </div>
  <div class="seg" id="tafSeg" style="margin-bottom:12px">${Object.keys(TAFS).map(k=>`<button data-k="${k}" aria-pressed="${S.taf===k}">${TAFS[k][0]}</button>`).join('')}</div>
  <div id="tafBody"><div class="spin"></div></div>
  <div class="stepper"><button id="aNext" ${a>=total?'disabled':''}>الآية التالية ←</button><button id="aPrev" ${a<=1?'disabled':''}>→ الآية السابقة</button></div>`;
  openSheet(`سورة ${Q.s[s-1].n} · الآية ${AR(a)}`,wrap);
  $('#aPlay',wrap).onclick=()=>{closeSheet();play(s,a)};
  $('#aCopy',wrap).onclick=()=>copyText(`${Q.a[s-1][a-1]} ﴿${Q.s[s-1].n}: ${a}﴾`);
  $('#aBm',wrap).onclick=e=>{
    const i=S.bm.findIndex(b=>b.s===s&&b.a===a);
    if(i>=0){S.bm.splice(i,1);e.currentTarget.classList.remove('on');toast('أُزيلت العلامة')}else{S.bm.push({s,a});e.currentTarget.classList.add('on');toast('تم حفظ العلامة')}
    lsSet('bm',S.bm);
  };
  $('#aAsk',wrap).onclick=()=>{closeSheet();askAbout(`اشرح لي هذه الآية من سورة ${Q.s[s-1].n} (الآية ${a}) شرحًا موجزًا، وبيّن سبب نزولها إن كان ثابتًا:\n${Q.a[s-1][a-1]}`)};
  $('#aNext',wrap).onclick=()=>{if(a<total){openAyah(s,a+1);scrollAy(a+1)}};
  $('#aPrev',wrap).onclick=()=>{if(a>1){openAyah(s,a-1);scrollAy(a-1)}};
  $('#tafSeg',wrap).onclick=e=>{const b=e.target.closest('button');if(!b)return;S.taf=b.dataset.k;lsSet('taf',S.taf);
    wrap.querySelectorAll('#tafSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===S.taf));loadTafsir()};
  async function loadTafsir(){
    const box=$('#tafBody',wrap);box.innerHTML='<div class="spin"></div>';
    const key=S.taf,def=TAFS[key];
    try{
      const d=await getJSON(def[1]);
      if(S.taf!==key)return;
      const gi=d.m[s-1][a-1],text=d.g[s-1][gi];
      let from=a,to=a;const m=d.m[s-1];while(from>1&&m[from-2]===gi)from--;while(to<m.length&&m[to]===gi)to++;
      const rng=to>from?`<div class="range">هذا التفسير يشمل الآيات ${AR(from)} إلى ${AR(to)}</div>`:'';
      box.innerHTML=`${rng}<div class="tafsir">${fmtTafsir(text)}</div><p class="note">المصدر: ${def[0]} — ${def[2]}</p>`;
    }catch(e){box.innerHTML='<div class="empty">تعذّر تحميل التفسير. تحقق من الاتصال وحاول مرة أخرى.</div>'}
  }
  loadTafsir();
}
function scrollAy(a){const el=$('#a'+a);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}

/* ---------- audio ---------- */
const au=new Audio();au.preload='auto';
const url=(s,a)=>`https://everyayah.com/data/${S.rec}/${p3(s)}${p3(a)}.mp3`;
$('#pPrev').innerHTML=I.prev;$('#pNext').innerHTML=I.next;$('#pClose').innerHTML=I.close;$('#pToggle').innerHTML=I.play;
function markPlaying(){
  document.querySelectorAll('.ay.playing').forEach(x=>x.classList.remove('playing'));

function updatePlayer(){
  const p=$('#player');

function play(s,a){
  S.pl={s,a};S.ext=false;
  if(S.surah!==s)openSurah(s,0);

au.addEventListener('ended',()=>{

  const tot=Q.s[S.pl.s-1].c;

});
au.addEventListener('error',()=>{if(!S.pl)return;S.ext=true;S.playing=false;updatePlayer()});
au.addEventListener('playing',()=>{S.ext=false;S.playing=true;updatePlayer()});
au.addEventListener('pause',()=>{if(!au.ended){S.playing=false;updatePlayer()}});
$('#pToggle').onclick=()=>{
  if(!S.pl)return;
  if(S.playing){au.pause()}else if(au.src&&!S.ext){au.play().catch(()=>{})}else play(S.pl.s,S.pl.a);
};
$('#pNext').onclick=()=>{if(S.pl&&S.pl.a<Q.s[S.pl.s-1].c)play(S.pl.s,S.pl.a+1)};

$('#pClose').onclick=()=>{au.pause();au.removeAttribute('src');S.pl=null;S.playing=false;S.ext=false;markPlaying();updatePlayer()};

const HS={
  nawawi:{n:'الأربعون النووية',file:'nawawi',mb:'٠٫٠٤',desc:'متن الأربعين النووية للإمام النووي، مع ما ذكره من التخريج.'},
  bukhari:{n:'صحيح البخاري',file:'bukhari',mb:'٨٫٧',desc:'الجامع الصحيح للإمام محمد بن إسماعيل البخاري.'},

function toolbarHadith(){

async function renderHadith(){

    if(k!=='nawawi'){

async function renderHadith2(){
  const v=$('#v-hadith'),k=S.hsub,def=HS[k];
  if(!cache[def.file]){
    v.innerHTML='<div class="spin"></div>';
    try{await getJSON(def.file)}catch(e){v.innerHTML='<div class="loadbox"><p>تعذّر تحميل الملف. تحقق من الاتصال.</p><button class="btn" id="hRe">إعادة المحاولة</button></div>';$('#hRe').onclick=renderHadith2;return}
  }
  if(S.hsub!==k)return;
  let data=cache[def.file];
  const arr=k==='nawawi'?data.map(h=>[h.n,h.t]):data;
  if(!arr._n)arr._n=arr.map(h=>NORM(h[1]));
  v.innerHTML=`<input class="search" id="hq" type="search" placeholder="ابحث بكلمة من الحديث أو برقمه" value="${esc(S.hq)}" aria-label="بحث في الأحاديث"><div id="hlist"></div>`;
  const draw=()=>{
    const t=S.hq.trim();let idx=[];
    if(!t){idx=arr.map((_,i)=>i)}
    else if(/^[\d٠-٩]+$/.test(t)){const n=+t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const i=arr.findIndex(h=>h[0]===n);idx=i>=0?[i]:[]}
    else{const nt=NORM(t);const words=nt.split(' ');arr._n.forEach((x,i)=>{if(words.every(w=>x.includes(w)))idx.push(i)})}
    const shown=idx.slice(0,S.hshown);
    $('#hlist').innerHTML=(idx.length?`<div class="note">${AR(idx.length)} حديث${k!=='nawawi'?' — الترقيم حسب مصدر البيانات وقد يختلف قليلًا عن بعض الطبعات':''}</div>`:'')+
      (shown.length?shown.map(i=>`<article class="card" data-i="${i}"><span class="no">${k==='nawawi'?'الحديث '+AR(arr[i][0]):'رقم '+AR(arr[i][0])} · ${def.n}</span><div class="tx">${esc(arr[i][1])}</div>
      <div class="row"><button class="act" data-do="copy">${I.copy}نسخ</button><button class="act" data-do="ask">${I.ask}اشرح لي</button></div></article>`).join(''):'<div class="empty">لا توجد نتائج</div>')+
      (idx.length>shown.length?'<button class="more" id="hMore">عرض المزيد</button>':'');
    const mb=$('#hMore');if(mb)mb.onclick=()=>{S.hshown+=40;draw()};
  };
  $('#hq').oninput=e=>{S.hq=e.target.value;S.hshown=40;draw()};
  $('#hlist').onclick=e=>{
    const b=e.target.closest('[data-do]');if(!b)return;
    const i=+b.closest('.card').dataset.i,h=arr[i];
    const ref=`${def.n} — ${k==='nawawi'?'الحديث '+h[0]:'رقم '+h[0]}`;
    if(b.dataset.do==='copy')copyText(`${h[1]}\n(${ref})`);
    else askAbout(`اشرح لي هذا الحديث شرحًا موجزًا، وبيّن درجته إن كنت متأكدًا (${ref}):\n${h[1].slice(0,1500)}`);
  };
  draw();
}

      ${it.c>1?`<button class="counter" data-do="cnt" data-left="${it.c}">التكرار ${AR(it.c)}</button>`:''}
      <button class="act" data-do="copy">${I.copy}نسخ</button><button class="act" data-do="ask">${I.ask}اشرح</button></div></article>`).join('')}
    <p class="note">المصدر: «حصن المسلم» لسعيد بن علي بن وهف القحطاني. ما كان خارج النص بين قوسين فهو بيان لكيفية الفعل.</p>`;
    $('#dBack').onclick=()=>{S.duaCat=null;renderDuas();window.scrollTo(0,0)};
    v.onclick=e=>{
      const b=e.target.closest('[data-do]');if(!b)return;
      const card=b.closest('.card'),it=c.i[+card.dataset.i];
      if(b.dataset.do==='copy')copyText(it.t);
      else if(b.dataset.do==='ask')askAbout(`اشرح لي هذا الدعاء أو الذكر وبيّن مناسبته وأصله من السنة إن أمكن (${c.n}):\n${it.t.slice(0,1200)}`);
      else if(b.dataset.do==='cnt'){
        let left=+b.dataset.left-1;b.dataset.left=left;
        if(left<=0){b.textContent='تم ✓';b.classList.add('done');card.classList.add('done')}else b.textContent='باقي '+AR(left);
      }
    };
    return;
  }
  v.onclick=null;
  v.innerHTML=`<input class="search" id="dq" type="search" placeholder="ابحث عن دعاء (مثل: السفر، الطعام، النوم)" aria-label="بحث في الأدعية">
  <p class="note">أدعية وأذكار النبي ﷺ من كتاب «حصن المسلم» (${AR(D.length)} باب)، مقسّمة حسب المناسبة.</p><div id="dlist"></div>`;
  const draw=()=>{
    const nt=NORM($('#dq').value);
    const f=D.filter(c=>!nt||NORM(c.n).includes(nt)||c.i.some(it=>NORM(it.t).includes(nt)));
    $('#dlist').innerHTML=f.length?f.map(c=>`<button class="cat" data-id="${c.id}"><span class="nm">${esc(c.n)}</span><span class="ct">${AR(c.i.length)}</span>${I.right}</button>`).join(''):'<div class="empty">لا توجد نتائج</div>';
  };
  $('#dq').oninput=draw;
  $('#dlist').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;S.duaCat=+b.dataset.id;renderDuas();window.scrollTo(0,0)};
  draw();
}

/* ================= ASK (AI) ================= */
const INSTR='أنت مساعد إسلامي هادئ ودقيق داخل تطبيق للقرآن الكريم. أجب بالعربية الفصحى المبسطة، وإن كتب السائل بالعامية فأجبه بلغة قريبة منه دون تكلّف. استند إلى القرآن الكريم والسنة الصحيحة وأقوال العلماء المعتبرين. عند ذكر آية اذكر اسم السورة ورقم الآية، وعند ذكر حديث اذكر الصحابي الراوي ومن أخرجه ودرجته إن كنت متأكدًا. إن لم تكن متأكدًا من نص أو نسبة فقل ذلك صراحة، ولا تختلق آية ولا حديثًا ولا قولًا لعالم. في المسائل الخلافية أو الفتاوى الشخصية اعرض أقوال أهل العلم باختصار وانصح بسؤال عالم موثوق. اجعل الجواب موجزًا ومرتبًا (فقرات قصيرة أو نقاط) في حدود ٢٥٠ كلمة ما لم يُطلب التفصيل.';
const SUGG=['ما معنى آية الكرسي وما فضلها؟','اشرح حديث «إنما الأعمال بالنيات»','ما الأذكار التي أقولها بعد الصلاة؟','ما فضل سورة الكهف يوم الجمعة؟','كيف أتدبر القرآن وأنا أقرأ؟'];
function mdLite(t){
  const lines=esc(t).split('\n');let out='',inList=false;
  for(const l of lines){
    const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if(m){if(!inList){out+='<ul>';inList=true}out+='<li>'+m[1]+'</li>'}
    else{if(inList){out+='</ul>';inList=false}if(l.trim())out+='<p>'+l+'</p>'}
  }
  if(inList)out+='</ul>';
  return out.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function renderAsk(){
  const v=$('#v-ask');
  if(!S.chat.length&&!v.querySelector('.msg')){
    v.innerHTML=`<div class="chat" id="chat"><div class="hello"><h2>اسأل عن أي شيء</h2><p>اسأل عن معنى آية، أو شرح حديث، أو دعاء، أو أي سؤال في الدين. الإجابات من الذكاء الاصطناعي وقد تخطئ، فتحقق من المصادر وارجع لأهل العلم في الفتاوى.</p>
    <div class="chips" id="chips">${SUGG.map(s=>`<button class="chip">${esc(s)}</button>`).join('')}</div></div></div>`;
    $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)ask(b.textContent)};
  }
  ensureSample().then(sm=>{
    if(sm===null&&!$('#noai')){const c=$('#chat');if(c)c.insertAdjacentHTML('afterbegin','<div class="msg a err" id="noai">المساعد غير متاح في هذا العرض. افتح التطبيق وأنت مسجّل الدخول لاستخدامه.</div>')}
  });
}
async function ensureSample(){
  if(S.sample!==undefined)return S.sample;
  try{S.sample=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){S.sample=null}
  return S.sample;
}
function askAbout(q){setTab('ask');ask(q)}
async function ask(q){
  q=(q||'').trim();if(!q||S.busy)return;
  const sm=await ensureSample();
  const chat=$('#chat');if(!chat)return;
  const hello=chat.querySelector('.hello');if(hello)hello.remove();
  chat.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q).replace(/\n/g,'<br>')}</div>`);
  const bub=document.createElement('div');bub.className='msg a';bub.textContent='يكتب…';chat.appendChild(bub);
  bub.scrollIntoView({block:'end',behavior:'smooth'});
  if(!sm){bub.classList.add('err');bub.textContent='المساعد غير متاح في هذا العرض.';return}
  S.busy=true;$('#askSend').disabled=true;
  const hist=S.chat.slice(-8);
  const msgs=hist.concat([{role:'user',content:q}]);
  msgs[0]={role:msgs[0].role,content:INSTR+'\n\n---\n'+msgs[0].content};
  try{
    const res=await sm(msgs,{cache:false,onText:({text})=>{if(text){bub.innerHTML=mdLite(text);bub.scrollIntoView({block:'end'})}}});
    const text=(res&&res.text)||'';
    bub.innerHTML=mdLite(text||'لم أتلقَّ إجابة. حاول مرة أخرى.');
    if(text){S.chat.push({role:'user',content:q},{role:'assistant',content:text})}
  }catch(e){
    bub.classList.add('err');
    bub.textContent=e&&e.code==='not_granted'?'لم تتم الموافقة على استخدام المساعد.':e&&e.code==='rate_limited'?'الطلبات كثيرة الآن. انتظر قليلًا ثم حاول.':'تعذّر الحصول على إجابة. حاول مرة أخرى.';
  }finally{S.busy=false;$('#askSend').disabled=false}
}
$('#askSend').innerHTML=I.send;
$('#askSend').onclick=()=>{const t=$('#askIn');const q=t.value;t.value='';t.style.height='auto';ask(q)};
$('#askIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#askSend').click()}});
$('#askIn').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(130,t.scrollHeight)+'px'});

/* ---------- boot ---------- */
applyTheme();setFs(S.fs);
const h=(location.hash||'').replace('#','');
setTab(['quran','hadith','duas','ask'].includes(h)?h:'quran');
initQuran();
})();
</script>
